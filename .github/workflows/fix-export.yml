name: Fix PDF export

on:
  push:
    branches:
      - Master
    paths:
      - .github/workflows/fix-export.yml

permissions:
  contents: write

jobs:
  patch-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Add clear choices button and keep PDF export
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_toolbar = '<div class="toolbar"><button type="button" onclick="exportPDF()">Export PDF</button></div>'
          new_toolbar = '<div class="toolbar"><button type="button" onclick="clearChoices()">Clear Choices</button> <button type="button" onclick="exportPDF()">Export PDF</button></div>'
          if old_toolbar in text:
            text = text.replace(old_toolbar, new_toolbar, 1)

          start = text.index("function exportPDF() {")
          end = text.index("\n</script>", start)

          replacement = r'''function clearChoices() {
            if (!confirm("Clear all choices?")) return;

            document.querySelectorAll(".pick:checked").forEach(el => {
              el.checked = false;
            });

            saveState();
          }

          function exportPDF() {
            saveState();

            const enteredName = prompt("Enter your name for the PDF:");
            if (enteredName === null) return;

            const safeName = enteredName.trim().replace(/[^a-zA-Z0-9]/g, "");
            if (!safeName) {
              alert("Please enter a name before exporting.");
              return;
            }

            const filename = `${safeName}-NFLPICKS-WEEK1.pdf`;
            const button = document.querySelector('.toolbar button[onclick="exportPDF()"]');
            const originalText = button ? button.textContent : "Export PDF";

            try {
              if (!window.jspdf || !window.jspdf.jsPDF) {
                throw new Error("PDF library did not load.");
              }

              const img = document.getElementById("sheetImage");

              if (!img || !img.complete || !img.naturalWidth) {
                alert("The worksheet is still loading. Please try Export PDF again.");
                return;
              }

              if (button) {
                button.disabled = true;
                button.textContent = "Exporting...";
              }

              const { jsPDF } = window.jspdf;
              const pdf = new jsPDF({
                orientation: "portrait",
                unit: "pt",
                format: "letter",
                compress: true
              });

              pdf.addImage(img.src, "JPEG", 0, 0, 612, 792, undefined, "FAST");

              pdf.setFillColor(255, 255, 255);
              pdf.rect(0, 792 * 0.1185, 612, 792 * 0.0305, "F");

              document.querySelectorAll(".pick:checked").forEach(el => {
                const fieldName = el.dataset.field;
                const field = FIELDS.find(f => f.name === fieldName);
                if (field) drawCheck(pdf, field);
              });

              pdf.save(filename);
            } catch (err) {
              console.error("PDF export failed:", err);
              alert("PDF export failed.\n\n" + (err && err.message ? err.message : "Unknown error"));
            } finally {
              if (button) {
                button.disabled = false;
                button.textContent = originalText;
              }
            }
          }'''

          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

      - name: Commit patched page
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Clear Choices button"
          git push origin Master

# Trigger clear choices patch.
