name: Fix PDF export

on:
  push:
    branches:
      - Master
    paths:
      - .github/workflows/fix-export.yml

permissions:
  contents: write

jobs:
  patch-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: Master

      - name: Replace exportPDF function
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          start = text.index("function exportPDF() {")
          end = text.index("\n</script>", start)

          replacement = r'''function exportPDF() {
            saveState();

            const button = document.querySelector(".toolbar button");
            const originalText = button ? button.textContent : "Export PDF";

            try {
              if (!window.jspdf || !window.jspdf.jsPDF) {
                throw new Error("PDF library did not load.");
              }

              const img = document.getElementById("sheetImage");

              if (!img || !img.complete || !img.naturalWidth) {
                alert("The worksheet is still loading. Please try Export PDF again.");
                return;
              }

              if (button) {
                button.disabled = true;
                button.textContent = "Exporting...";
              }

              const { jsPDF } = window.jspdf;
              const pdf = new jsPDF({
                orientation: "portrait",
                unit: "pt",
                format: "letter",
                compress: true
              });

              pdf.addImage(
                img.src,
                "JPEG",
                0,
                0,
                612,
                792,
                undefined,
                "FAST"
              );

              // Hide the Name / Date row in the exported PDF.
              pdf.setFillColor(255, 255, 255);
              pdf.rect(
                0,
                792 * 0.1185,
                612,
                792 * 0.0305,
                "F"
              );

              // Draw selected picks directly into the PDF using field coordinates.
              document.querySelectorAll(".pick:checked").forEach(el => {
                const fieldName = el.dataset.field;
                const field = FIELDS.find(f => f.name === fieldName);

                if (field) {
                  drawCheck(pdf, field);
                }
              });

              pdf.save("Week_1_NFL_Picks.pdf");
            } catch (err) {
              console.error("PDF export failed:", err);
              alert(
                "PDF export failed.\n\n" +
                (err && err.message ? err.message : "Unknown error")
              );
            } finally {
              if (button) {
                button.disabled = false;
                button.textContent = originalText;
              }
            }
          }'''

          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

      - name: Commit patched exporter
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix PDF export function"
          git push origin Master
