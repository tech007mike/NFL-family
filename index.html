function saveState() {
  const state = {};
  document.querySelectorAll(".pick:checked").forEach(el => state[el.name] = el.value);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
  try {
    const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    Object.entries(state).forEach(([group, value]) => {
      const match = [...document.getElementsByName(group)].find(el => el.value === value);
      if (match) match.checked = true;
    });
  } catch (e) {}
}

document.addEventListener("change", e => {
  if (e.target.classList.contains("pick")) saveState();
});
loadState();

function drawCheck(pdf, f) {
  const x = f.x, y = f.y, w = f.w, h = f.h;
  pdf.setLineWidth(Math.max(1.15, w * 0.10));
  pdf.setDrawColor(15,15,15);
  pdf.line(x + w*0.18, y + h*0.52, x + w*0.42, y + h*0.76);
  pdf.line(x + w*0.42, y + h*0.76, x + w*0.84, y + h*0.22);
}

function exportPDF() {
  saveState();
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("PDF export library could not load. Please check your internet connection.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:"portrait", unit:"pt", format:"letter", compress:true});
  const img = document.getElementById("sheetImage");
  pdf.addImage(img.src, "JPEG", 0, 0, 612, 792, undefined, "FAST");

  // Keep Name and Date removed in the exported, flattened PDF.
  pdf.setFillColor(255,255,255);
  pdf.rect(0, 93.8, 612, 24.3, "F");

  document.querySelectorAll(".pick:checked").forEach(el => {
    const f = FIELDS.find(v => v.name === el.dataset.field);
    if (f) drawCheck(pdf, f);
  });

  pdf.save("Week_1_NFL_Picks.pdf");
}
